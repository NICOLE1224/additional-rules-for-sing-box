name: Test converter

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; Node 24
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python scripts/install_sing_box.py
      - env:
          SING_BOX_BINARY: ${{ github.workspace }}/.tools/sing-box
        run: python -m unittest discover -s tests -v
