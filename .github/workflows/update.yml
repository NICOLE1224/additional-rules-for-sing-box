name: Update domain rule-sets

on:
  workflow_dispatch:
  schedule:
    # Check upstream every six hours; unchanged commits skip all build steps.
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'toolchain.json'
      - 'known_invalid.json'
      - 'README.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: domain-rule-sets
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout converter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24

      - name: Check upstream and published manifests
        id: upstream
        run: python3 scripts/check_upstream.py

      - name: Set up Python
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; Node 24
        with:
          python-version: '3.12'
          cache: pip

      - name: Install YAML parser and verified compiler
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements.txt
          python scripts/install_sing_box.py

      - name: Check conversion and publishing behavior
        if: steps.upstream.outputs.changed == 'true'
        env:
          SING_BOX_BINARY: ${{ github.workspace }}/.tools/sing-box
        run: python -m unittest discover -s tests -v

      - name: Checkout the exact upstream commit
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          repository: Accademia/Additional_Rule_For_Clash
          ref: ${{ steps.upstream.outputs.upstream_sha }}
          path: upstream
          persist-credentials: false

      - name: Build JSON, SRS and Shadowrocket rule-sets and validate binaries
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/convert.py --source upstream --output dist

      - name: Save downloadable build artifacts
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: domain-rule-sets
          path: |
            dist/json/
            dist/srs/
            dist/shadowrocket/
          if-no-files-found: error
          retention-days: 7

      - name: Checkout disposable publication workspace
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          path: _publish

      - name: Publish JSON, SRS and Shadowrocket branches atomically
        if: steps.upstream.outputs.changed == 'true'
        run: bash scripts/publish.sh _publish dist

      - name: Verify all published branch contents
        if: steps.upstream.outputs.changed == 'true'
        run: python scripts/verify_published.py --published-git _publish --output dist

      - name: Report result
        if: success()
        env:
          CHANGED: ${{ steps.upstream.outputs.changed }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          if [[ "$CHANGED" == true ]]; then
            echo "JSON, SRS and Shadowrocket branches updated from upstream $UPSTREAM_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Upstream and converter are unchanged; build and publication skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
